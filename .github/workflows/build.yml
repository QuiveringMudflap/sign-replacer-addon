name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2G"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sign-replacer-addon
          path: build/libs/*-mc*.jar

  # New release on every push to main (tag = release-<short-sha>)
  release-main:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sign-replacer-addon

      - name: Create Release (main)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Release #${{ github.run_number }} (${{ github.sha }})
          body: "Auto-release from main. Commit: ${{ github.sha }}"
          files: "*-mc*.jar"
          generate_release_notes: true

  # Release when you push a version tag (e.g. v1.0.0)
  release-tag:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sign-replacer-addon

      - name: Create Release (tag)
        uses: softprops/action-gh-release@v2
        with:
          files: "*-mc*.jar"
          generate_release_notes: true
