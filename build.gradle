plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
    id 'java'
}

group = project.maven_group
version = project.mod_version

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.meteordev.org/releases' }
    maven { url 'https://maven.meteordev.org/snapshots' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor Client
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Copy JAR with Minecraft version in filename
tasks.register('copyWithVersion', Copy) {
    dependsOn remapJar
    from("build/libs/${project.archives_base_name}-${project.mod_version}.jar")
    into("build/libs")
    rename { "${project.archives_base_name}-${project.mod_version}-mc${project.minecraft_version}.jar" }
}

// Prism Launcher mods folder – override with -PmodsDir=/path/to/mods if needed
def modsDir = project.hasProperty('modsDir')
    ? project.modsDir
    : "${System.getProperty('user.home')}/Library/Application Support/PrismLauncher/instances/1.21.4(1)/minecraft/mods"

tasks.register('deployToMods', Copy) {
    dependsOn copyWithVersion
    from("build/libs/${project.archives_base_name}-${project.mod_version}-mc${project.minecraft_version}.jar")
    into(modsDir)
    doLast { logger.lifecycle("Deployed JAR to ${modsDir}") }
}

tasks.named('build') {
    finalizedBy copyWithVersion
    finalizedBy deployToMods
}

// Optional: push to git after building. Uses anonymous author so your real name isn't on the repo.
tasks.register('pushRepo', Exec) {
    dependsOn build
    onlyIf { project.file('.git').exists() }
    commandLine 'sh', '-c', "export GIT_AUTHOR_NAME=QuiveringMudflap && export GIT_AUTHOR_EMAIL=quiveringmudflap@users.noreply.github.com && export GIT_COMMITTER_NAME=QuiveringMudflap && export GIT_COMMITTER_EMAIL=quiveringmudflap@users.noreply.github.com && git add -A && git commit -m 'Build ${project.mod_version} mc${project.minecraft_version}' --allow-empty && git push"
    ignoreExitValue true
}
